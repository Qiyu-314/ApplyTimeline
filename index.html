<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ApplyTimeline</title>
  <style>
    :root {
      --bg-1: #fff4ea;
      --bg-2: #eafaf3;
      --ink: #142033;
      --muted: #66768a;
      --card: #ffffff;
      --done: #12a060;
      --doing: #ff7a1a;
      --todo: #ffc089;
      --today: #e11d70;
      --accent: #2563eb;
      --hku: #163d2e;
      --dark: #141c28;
      --dark-2: #1c2736;
      --shadow: 0 16px 40px rgba(20, 32, 51, 0.1);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    html { scroll-padding-top: 72px; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 8% -8%, #ffd48a 0%, transparent 52%),
        radial-gradient(760px 400px at 100% 0%, #9af0c8 0%, transparent 50%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 10px 18px;
      background: rgba(20, 53, 40, 0.96);
      color: #fff;
      box-shadow: 0 8px 24px rgba(20, 32, 51, 0.16);
    }
    .topbar-brand {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.01em;
      cursor: default;
      user-select: none;
      pointer-events: none;
    }
    .topbar-links {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .topbar-links a,
    .topbar-links button {
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .topbar-links a:hover,
    .topbar-links button:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .help-modal {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(20, 32, 51, 0.48);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(8px);
    }
    .help-modal[hidden] { display: none; }
    .help-card {
      width: min(640px, 100%);
      max-height: min(80vh, 720px);
      overflow: auto;
      background: #fff;
      color: var(--ink);
      border-radius: 28px;
      padding: 26px 24px 22px;
      box-shadow: var(--shadow);
    }
    .help-card h2 {
      margin: 0 0 14px;
      font-size: 22px;
    }
    .help-card p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }
    .help-card p:last-of-type { margin-bottom: 18px; }
    .help-close {
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      border: 0;
      background: #143528;
      color: #fff;
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
    }
    .help-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .help-ack {
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      border: 0;
      background: #2563eb;
      color: #fff;
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
    }

    .back-top {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 35;
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: #143528;
      color: #fff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(20, 32, 51, 0.22);
    }
    .back-top:hover { background: #1f5a42; }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 18px 56px;
    }

    header.hero {
      background: linear-gradient(135deg, #143528 0%, #1f5a42 48%, #2563eb 140%);
      color: #fff;
      border-radius: 28px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      animation: rise 0.55s var(--ease) both;
    }
    header.hero::after {
      content: "";
      position: absolute;
      right: -50px;
      top: -60px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
    }
    .eyebrow {
      display: inline-block;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
    }
    h1 {
      margin: 12px 0 8px;
      font-size: clamp(26px, 4vw, 40px);
      line-height: 1.15;
    }
    .lede {
      margin: 0;
      max-width: 46em;
      color: rgba(255, 255, 255, 0.9);
      font-size: 16px;
    }
    .today-banner {
      margin-top: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 12px 14px;
    }
    .today-banner strong { font-size: 18px; }
    .chip {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 800;
      background: #fff;
      color: var(--today);
    }

    .timeline-card {
      scroll-margin-top: 72px;
      margin-top: 22px;
      background: var(--card);
      border-radius: 28px;
      padding: 22px 18px 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: rise 0.65s var(--ease) 0.06s both;
    }
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 0 8px 4px;
    }
    .section-title h2 { margin: 0; font-size: 20px; }
    .sim-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background: #fff4ec;
      border: 1px solid #ffd2a8;
      border-radius: 999px;
      padding: 6px 10px 6px 14px;
    }
    .sim-bar label {
      font-size: 13px;
      font-weight: 800;
      color: #c45a00;
      white-space: nowrap;
    }
    .sim-bar select {
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      border: 0;
      background: #fff;
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
    }

    /* 整条月份轴：左右滑动换月；每一页裁切，避免隔壁月文字漏进来 */
    .swipe-hint {
      margin: 0 8px 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }
    .track-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0;
      overflow: hidden;
    }
    .month-nav {
      position: static;
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      margin: 0;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 6px 16px rgba(20, 32, 51, 0.16);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      color: var(--ink);
      z-index: 8;
    }
    .month-nav.prev,
    .month-nav.next { left: auto; right: auto; top: auto; }
    .month-nav:disabled { opacity: 0.3; cursor: default; }
    .jump-today {
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      border: 0;
      background: #ffe4ef;
      color: var(--today);
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .track-scroller {
      flex: 1;
      min-width: 0;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      cursor: grab;
      touch-action: pan-x;
    }
    .track-scroller:active { cursor: grabbing; }
    .month-pane {
      box-sizing: border-box;
      flex: 0 0 100%;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      overflow: hidden;
      padding: 76px 28px 48px;
      min-height: 520px;
    }
    .pane-month-label {
      position: absolute;
      top: 10px;
      left: 28px;
      right: 28px;
      margin: 0;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
    }
    .month-pane .rail {
      position: relative;
      height: 48px;
      margin: 0 8px;
    }
    .month-pane .axis {
      left: 0;
      right: 0;
      top: 21px;
      transform: none;
      animation: none;
    }
    .month-pane .nodes {
      position: relative;
      z-index: 3;
      display: block;
      min-width: 0;
      width: 100%;
      height: 48px;
      overflow: visible;
    }
    .month-pane .node {
      position: absolute;
      top: 0;
      left: var(--x);
      width: 48px;
      margin-left: -24px;
      transform: none;
      flex: none;
      z-index: 3;
    }
    .month-pane .node.open { z-index: 6; }
    .month-pane .caption {
      position: absolute;
      top: calc(76px + (var(--drop, 0) * 1px));
      left: 50%;
      width: 132px;
      max-width: 132px;
      margin: 0;
      padding: 0 2px;
      transform: translateX(-50%);
      z-index: 3;
    }
    .month-pane .node.near-start .caption {
      left: 0;
      transform: none;
      text-align: left;
    }
    .month-pane .node.near-end .caption {
      left: auto;
      right: 0;
      transform: none;
      text-align: right;
    }
    .month-pane .node.near-start .caption .region-tag,
    .month-pane .node.near-end .caption .region-tag { margin-left: 0; margin-right: 0; }
    .month-ticks {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 8px 0;
      min-height: 20px;
      font-size: 11px;
      line-height: 20px;
      font-weight: 800;
      color: var(--muted);
      position: relative;
      z-index: 4;
      pointer-events: none;
    }
    .month-pane .today-pin {
      left: var(--x);
      top: 24px;
      width: max-content;
      height: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      transform: translate(-50%, -100%);
      opacity: 1;
      z-index: 7;
    }
    .month-pane .today-pin .today-label,
    .month-pane .today-pin.at-start .today-label,
    .month-pane .today-pin.at-end .today-label {
      position: static;
      left: auto;
      bottom: auto;
      transform: none;
      margin: 0;
    }
    .month-pane .today-pin .today-stem {
      position: static;
      display: block;
      left: auto;
      bottom: auto;
      transform: none;
      width: 2px;
      height: 28px;
      margin: -2px 0 0;
    }
    .caption .task-line {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 2px;
    }
    .caption .task-line:first-child,
    .caption time + .task-line { margin-top: 2px; }
    .month-pane .caption time {
      margin: 0;
      line-height: 1.2;
    }
    .month-pane .caption.single .task-line {
      margin-top: 0;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .month-pane .node.near-start .caption.single .task-line { align-items: flex-start; }
    .month-pane .node.near-end .caption.single .task-line { align-items: flex-end; }
    .month-pane .node.near-start .task-line { justify-content: flex-start; }
    .month-pane .node.near-end .task-line { justify-content: flex-end; }
    .caption .task-line .region-tag {
      display: inline-block;
      margin: 0;
    }
    .month-pane .caption .task-line strong {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 12px;
      margin: 0;
    }
    .detail-block {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .detail-block:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    /* 桌面：横轴。上方留给 📍 今天 标签 + 竖线 */
    .rail {
      position: relative;
      min-height: 48px;
    }
    .axis {
      position: absolute;
      left: 28px;
      right: 28px;
      top: 21px;
      height: 6px;
      border-radius: 99px;
      background: #efe8dc;
      overflow: hidden;
      z-index: 1;
    }
    .axis-fill {
      height: 100%;
      width: var(--progress, 0%);
      border-radius: inherit;
      background: linear-gradient(90deg, #12a060 0%, #7ed9a8 40%, #ffb347 78%, #ff7a1a 100%);
      transition: width 0.55s var(--ease), height 0.55s var(--ease);
    }

    /* 玫红标签 + 竖线，原点落在横轴上；left/top 变化时平滑滑过去 */
    .today-pin {
      position: absolute;
      z-index: 5;
      pointer-events: none;
      width: 0;
      height: 0;
      opacity: 0;
    }
    .today-pin.show { opacity: 1; }
    .today-pin.ready {
      transition: left 0.55s var(--ease), top 0.55s var(--ease), opacity 0.25s ease;
    }
    .today-stem {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 2px;
      height: 46px;
      background: var(--today);
      border-radius: 2px;
      transform: translateX(-50%);
      box-shadow: 0 0 0 3px rgba(225, 29, 112, 0.12);
    }
    .today-label {
      position: absolute;
      left: 0;
      bottom: 46px;
      transform: translateX(-50%);
      background: var(--today);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
      padding: 5px 10px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 8px 18px rgba(225, 29, 112, 0.32);
    }

    .nodes {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      min-width: 760px;
    }
    .node {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: 0;
      padding: 0;
      margin: 0;
      cursor: pointer;
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    /* 48px 热区包住圆点，避免手机点偏 */
    .orb-hit {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 3;
    }
    .orb {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0);
      transition: transform 0.25s var(--ease), box-shadow 0.25s ease, background 0.3s ease;
      animation: orbPop 0.48s var(--ease) forwards;
      animation-delay: calc(0.26s + var(--i, 0) * 0.1s);
    }
    .node.done .orb { background: var(--done); }
    .node.done .orb::after {
      content: "✓";
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      line-height: 1;
    }
    .node.doing .orb { background: var(--doing); }
    .node.doing .orb::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      animation: breathe 1.7s ease-out infinite;
    }
    .node.todo .orb { background: var(--todo); }
    .node.open .orb {
      box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.28), 0 3px 10px rgba(0, 0, 0, 0.12);
    }
    .node:hover .orb { transform: scale(1.08); }
    .nodes.no-intro .orb {
      opacity: 1;
      transform: scale(1);
      animation: none;
    }
    .nodes.no-intro .node:hover .orb { transform: scale(1.08); }

    .caption {
      margin-top: 8px;
      text-align: center;
      width: 100%;
      max-width: 180px;
      padding: 0 4px 8px;
      transition: color 0.25s ease;
    }
    .caption strong {
      display: block;
      font-size: 13px;
      line-height: 1.35;
      margin-bottom: 4px;
    }
    .caption time {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .caption .range {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 800;
      color: #c45a00;
      line-height: 1.35;
    }
    .caption .tz {
      display: block;
      margin-top: 3px;
      font-size: 10px;
      font-weight: 600;
      color: #8b9aab;
      line-height: 1.35;
    }
    .caption .region-tag {
      display: block;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto 5px;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .caption .region-tag.us,
    .badge.region-us { background: #2563eb; color: #fff; }
    .caption .region-tag.uk,
    .badge.region-uk { background: #6d28d9; color: #fff; }
    .caption .region-tag.hk,
    .badge.region-hk { background: #163d2e; color: #fff; }
    .caption .pred-tag {
      display: inline-block;
      margin-top: 4px;
      background: #fff4ec;
      color: #c45a00;
      border-radius: 999px;
      padding: 1px 7px;
      font-size: 10px;
      font-weight: 800;
    }
    .node.open .caption strong { color: var(--accent); }
    .today-slot {
      flex: 0.85;
      min-width: 56px;
      min-height: 48px;
      pointer-events: none;
    }
    .month-pane .empty-month {
      text-align: center;
      margin: 18px 12px 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    /* 深色详情卡；[hidden] 必须自己写，否则动画/display 会把原生 hidden 顶掉 */
    .detail {
      margin: 10px 8px 6px;
      border-radius: 22px;
      background: linear-gradient(165deg, var(--dark-2) 0%, var(--dark) 100%);
      color: #eef4f8;
      padding: 20px 22px 12px;
      box-shadow: 0 18px 40px rgba(20, 32, 51, 0.22);
      animation: rise 0.35s var(--ease) both;
    }
    .detail[hidden] { display: none; }
    .detail-head {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .detail-head h3 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.01em;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 800;
    }
    .badge.done { background: var(--done); color: #fff; }
    .badge.doing { background: var(--doing); color: #fff; }
    .badge.todo { background: var(--todo); color: #7a3b00; }
    .badge.predicted { background: #fff4ec; color: #c45a00; }
    .badge.here { background: var(--today); color: #fff; }

    .change-profile {
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      border: 0;
      background: #eef4f8;
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .phase-note {
      margin: 8px 12px 12px;
      padding: 12px 14px;
      background: #fff4ec;
      border: 1px solid #ffd2a8;
      border-radius: 14px;
      color: #c45a00;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
    }

    .setup {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(20, 32, 51, 0.48);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(8px);
    }
    .setup[hidden] { display: none; }
    .setup-card {
      width: min(540px, 100%);
      background: #fff;
      border-radius: 28px;
      padding: 28px 26px 24px;
      box-shadow: var(--shadow);
      animation: rise 0.45s var(--ease) both;
    }
    .setup-card h2 {
      margin: 10px 0 8px;
      font-size: 26px;
    }
    .setup-lead {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }
    .field-label {

            if (typeof p.predicted === "boolean") item.predicted = p.predicted;
          });
        });
        if (p.start && outlineById[p.id]) outlineById[p.id](p.start);
      });
    }
    function loadChecks() {
      if (useBackend) {
        return Object.assign({}, memoryTodosByYear[String(entryYear)] || {});
      }
      try {
        const merged = JSON.parse(localStorage.getItem(storageKey())) || {};
        ["us", "hk", "uk", "all"].forEach(function (rid) {
          try {
            const old = JSON.parse(localStorage.getItem("applytimeline-todos-v2-" + rid + "-" + entryYear) || "null");
            if (!old) return;
            Object.keys(old).forEach(function (k) {
              if (!merged[k]) merged[k] = old[k];
            });
          } catch (err) {}
        });
        return merged;
      }
      catch (e) { return {}; }
    }
    function todoKey(item) {
      if (item && (item.role === "start" || item.role === "end") && item.rangeId) return item.rangeId;
      return item.id;
    }
    function loadItemChecks(item) {
      const all = loadChecks();
      const key = todoKey(item);
      const saved = Object.assign({}, all[key] || {});
      if (item.role === "start" || item.role === "end") {
        const leftovers = [all[item.rangeId + "-start"], all[item.rangeId + "-end"]];
        leftovers.forEach(function (obj) {
          if (!obj) return;
          Object.keys(obj).forEach(function (k) {
            if (obj[k]) saved[k] = true;
          });
        });
      }
      return saved;
    }

    function isSpanning(item) {
      return item.rangeStart && item.rangeEnd && item.rangeStart.slice(0, 10) !== item.rangeEnd.slice(0, 10);
    }

    function rangeStartMoment(iso) {
      return iso.indexOf("T") !== -1 ? parseDate(iso) : startOfDay(parseDate(iso));
    }
    function rangeEndMoment(iso) {
      return iso.indexOf("T") !== -1 ? parseDate(iso) : endOfDay(parseDate(iso));
    }
    function inRange(today, startIso, endIso) {
      const t = today.getTime();
      return t >= rangeStartMoment(startIso).getTime() && t <= rangeEndMoment(endIso).getTime();
    }

    function monthsBetween(startIso, endIso) {
      const out = [];
      const s = parseDate(startIso);
      const e = parseDate(endIso);
      const cur = new Date(s.getFullYear(), s.getMonth(), 1);
      const last = new Date(e.getFullYear(), e.getMonth(), 1);
      while (cur <= last) {
        out.push(cur.getFullYear() + "-" + String(cur.getMonth() + 1).padStart(2, "0"));
        cur.setMonth(cur.getMonth() + 1);
      }
      return out;
    }

    function buildMilestones(regionId, year) {
      const delta = year - 2027;
      const ids = regionId === "all" ? ["us", "uk", "hk"] : [regionId];
      const out = [];
      ids.forEach(function (rid) {
        const tpl = TEMPLATES[rid] || [];
        const regionName = REGION_META[rid] ? REGION_META[rid].name : rid;
        tpl.forEach(function (item) {
          const start = shiftIso(item.start, delta);
          const end = shiftIso(item.end || item.start, delta);
          const mark = shiftIso(item.mark || item.start, delta);
          const shared = {
            rangeId: item.id,
            rangeStart: start,
            rangeEnd: end,
            dateLabel: shiftYearInText(item.dateLabel || "", delta),
            tzNote: shiftYearInText(item.tzNote || "", delta),
            summary: shiftYearInText(item.summary, delta),
            todos: (item.todos || []).map(function (t) { return shiftYearInText(t, delta); }),
            predicted: !!item.predicted,
            phaseName: item.name,
            regionId: rid,
            regionName: regionName
          };
          if (start.slice(0, 7) !== end.slice(0, 7)) {
            out.push(Object.assign({}, shared, {
              id: item.id + "-start",
              name: item.name + " · 开始",
              date: start,
              role: "start"
            }));
            out.push(Object.assign({}, shared, {
              id: item.id + "-end",
              name: item.name + " · 结束",
              date: end,
              role: "end"
            }));
          } else {
            const sameDay = start.slice(0, 10) === end.slice(0, 10);
            out.push(Object.assign({}, shared, {
              id: item.id,
              name: item.name,
              date: mark,
              role: sameDay ? "point" : "span"
            }));
          }
        });
      });
      return out;
    }

    function attachStatus(list, today) {
      const sorted = list.slice().sort(function (a, b) {
        const dt = parseDate(a.date) - parseDate(b.date);
        if (dt !== 0) return dt;
        return a.id < b.id ? -1 : 1;
      });
      let currentPointId = null;
      for (let i = 0; i < sorted.length; i++) {
        if (!isSpanning(sorted[i]) && startOfDay(parseDate(sorted[i].date)) >= today) {
          currentPointId = sorted[i].id;
          break;
        }
      }
      const rankStatus = { doing: 0, todo: 1, done: 2 };
      const rankRole = { point: 0, start: 1, span: 2, end: 3 };
      const withStatus = sorted.map(function (item) {
        let status = "todo";
        if (isSpanning(item)) {
          if (inRange(today, item.rangeStart, item.rangeEnd)) status = "doing";
          else if (today.getTime() > rangeEndMoment(item.rangeEnd).getTime()) status = "done";
          else status = "todo";
        } else {
          const d = startOfDay(parseDate(item.date));
          if (d < today) status = "done";
          else if (item.id === currentPointId || d.getTime() === today.getTime()) status = "doing";
          else status = "todo";
        }
        return Object.assign({}, item, { status: status });
      });
      withStatus.sort(function (a, b) {
        const dt = parseDate(a.date) - parseDate(b.date);
        if (dt !== 0) return dt;
        const rs = (rankStatus[a.status] || 9) - (rankStatus[b.status] || 9);
        if (rs !== 0) return rs;
        const rr = (rankRole[a.role] || 9) - (rankRole[b.role] || 9);
        if (rr !== 0) return rr;
        return a.id < b.id ? -1 : 1;
      });
      return withStatus;
    }

    function uniquePhases(list) {
      const seen = {};
      const phases = [];
      list.forEach(function (m) {
        if (!m.rangeId || seen[m.rangeId]) return;
        seen[m.rangeId] = true;
        phases.push(m);
      });
      return phases;
    }

    function phaseLabel(m) {
      return (m.regionName ? m.regionName + " · " : "") + m.phaseName;
    }

    function activePhase(list, today) {
      const phases = uniquePhases(list).filter(function (m) {
        return isSpanning(m) && inRange(today, m.rangeStart, m.rangeEnd);
      });
      phases.sort(function (a, b) {
        return (rangeEndMoment(a.rangeEnd) - rangeStartMoment(a.rangeStart)) - (rangeEndMoment(b.rangeEnd) - rangeStartMoment(b.rangeStart));
      });
      return phases[0] || null;
    }

    function coveringPhaseForMonth(ym) {
      const phases = uniquePhases(milestones).filter(function (m) {
        if (!isSpanning(m)) return false;
        const months = monthsBetween(m.rangeStart, m.rangeEnd);
        return months.indexOf(ym) !== -1;
      });
      phases.sort(function (a, b) {
        return (rangeEndMoment(a.rangeEnd) - rangeStartMoment(a.rangeStart)) - (rangeEndMoment(b.rangeEnd) - rangeStartMoment(b.rangeStart));
      });
      return phases[0] || null;
    }

    function getToday() {

    function dateKey(iso) {
      return String(iso || "").slice(0, 10);

    function daysInMonth(ym) {
      const p = String(ym).split("-").map(Number);
      return new Date(p[0], p[1], 0).getDate();
    }

    function dayPercent(iso) {
      const key = dateKey(iso);
      const p = key.split("-").map(Number);
      const days = new Date(p[0], p[1], 0).getDate();
      const day = p[2] || 1;
      return ((day - 0.5) / days) * 100;
    }

    function groupStatus(items) {
      if (items.some(function (m) { return m.status === "doing"; })) return "doing";
      if (items.some(function (m) { return m.status === "todo"; })) return "todo";
      return "done";
    }

    function groupDays(list) {
      const map = {};
      const order = [];
      list.forEach(function (m) {
        const key = dateKey(m.date);
        if (!map[key]) {
          map[key] = [];
          order.push(key);
        }
        map[key].push(m);
      });
      return order.map(function (key) {
        const items = map[key];
        return {
          id: "day-" + key,
          date: key,
          items: items,
          status: groupStatus(items)
        };
      });
    }

    function groupsForMonth(ym) {
      return groupDays(allDated.filter(function (m) { return monthKey(m.date) === ym; }));

      const match = dated.find(function (g) {

      if (!keepSelection || !match) {

      const n = Math.max(1, g.items.length);
      if (n === 1) return dateH + 56;
      return dateH + n * 50;
    }

    function captionRailWidth() {
      const scroller = document.getElementById("trackScroller");
      const w = scroller && scroller.clientWidth ? scroller.clientWidth : 720;
      return Math.max(240, w - 72);
    }

    function captionDropLevels(groups) {
      const railW = captionRailWidth();
      const capPx = 150;
      const gap = 12;
      const placed = [];
      const drops = [];
      groups.forEach(function (g) {
        const pct = dayPercent(g.date);
        const x = railW * pct / 100;
        let left;
        let right;
        if (pct < 12) {
          left = x;
          right = x + capPx;
        } else if (pct > 88) {
          left = x - capPx;
          right = x;
        } else {
          left = x - capPx / 2;
          right = x + capPx / 2;
        }
        const h = captionBlockHeight(g);
        let top = 0;
        let hit = true;
        let guard = 0;
        while (hit && guard < 24) {
          hit = false;
          guard += 1;
          const bottom = top + h;
          for (let j = 0; j < placed.length; j++) {
            const p = placed[j];
            const xHit = left < p.right && right > p.left;
            const yHit = top < p.bottom && bottom > p.top;
            if (xHit && yHit) {
              top = p.bottom + gap;
              hit = true;
              break;
            }
          }
        }
        drops.push(top);
        placed.push({ left: left, right: right, top: top, bottom: top + h });
      });
      return drops;
    }

    function groupCaptionHtml(g) {
      const showDay = !isTickDay(g.date);
      const dayText = showDay
        ? "<time datetime=\"" + esc(g.date) + "\">" + esc(formatDayShort(g.date)) + "</time>"
        : "";
      function itemTag(m) {
        return m.regionName
          ? "<span class=\"region-tag " + esc(m.regionId) + "\">" + esc(m.regionName) + "</span>"
          : "";
      }
      const lines = g.items.map(function (m) {
        return "<span class=\"task-line\">" + itemTag(m) + "<strong>" + esc(m.name) + "</strong></span>";
      }).join("");
      const single = g.items.length === 1 ? " single" : "";
      if (g.items.length === 1) {
        const m = g.items[0];
        return (
          "<span class=\"caption" + single + "\">" +
            "<span class=\"task-line\">" + dayText + itemTag(m) + "<strong>" + esc(m.name) + "</strong></span>" +
          "</span>"
        );
      }
      return (
        "<span class=\"caption\">" +
          dayText +
          lines +
        "</span>"
      );
    }

    function paneContentHeight(groups, drops) {
      let max = 320;
      groups.forEach(function (g, i) {
        const bottom = 76 + (drops[i] || 0) + captionBlockHeight(g) + 80;
        if (bottom > max) max = bottom;
      });
      return max;
    }

    function paneHtml(ym) {
      const groups = groupsForMonth(ym);
      const today = getToday();
      const todayKey = monthKey(todayIso(today));
      const progress = ym < todayKey ? 100 : (ym > todayKey ? 0 : dayPercent(todayIso(today)));
      const ticksDays = daysInMonth(ym);
      const mid = Math.round(ticksDays / 2);
      const ticks = "<div class=\"month-ticks\" aria-hidden=\"true\"><span>1日</span><span>" + mid + "日</span><span>" + ticksDays + "日</span></div>";
      const drops = captionDropLevels(groups);
      const paneH = paneContentHeight(groups, drops);
      const nodes = groups.map(function (g, index) {
        const pct = dayPercent(g.date);
        return (
          "<button class=\"" + nodeClass(g) + nodeEdgeClass(pct) + "\" type=\"button\" data-id=\"" + esc(g.id) + "\" style=\"--x:" + pct + "%;--drop:" + drops[index] + ";--i:" + index + "\" aria-expanded=\"" + (g.id === openId) + "\">" +
            "<span class=\"orb-hit\"><span class=\"orb\"></span></span>" +
            groupCaptionHtml(g) +
          "</button>"
        );
      }).join("");
      const empty = !groups.length
        ? "<p class=\"empty-month\">" + esc(coveringPhaseForMonth(ym) ? "这个月还没有新的截止点" : "这个月还没有申请节点") + "</p>"
        : "";
      return (
        "<article class=\"month-pane\" data-month=\"" + ym + "\" style=\"min-height:" + paneH + "px\">" +
          "<p class=\"pane-month-label\">" + esc(formatMonth(ym)) + "</p>" +
          "<div class=\"rail\">" +
            todayPinHtml(ym) +
            "<div class=\"axis\" aria-hidden=\"true\" style=\"--progress:" + progress + "%\"><div class=\"axis-fill\"></div></div>" +
            "<div class=\"nodes" + (introPlayed ? " no-intro" : "") + "\">" + nodes + "</div>" +
          "</div>" +
          ticks +
          empty +
        "</article>"
      );
    }

    function updateMonthNav() {
      const i = monthList.indexOf(selectedMonth);
      const prev = document.getElementById("monthPrev");
      const next = document.getElementById("monthNext");
      if (prev) prev.disabled = i <= 0;
      if (next) next.disabled = i < 0 || i >= monthList.length - 1;
    }

    function goMonth(delta) {
      const i = monthList.indexOf(selectedMonth);
      const next = monthList[i + delta];
      if (!next) return;
      selectedMonth = next;
      document.getElementById("simMonth").value = next;
      applyDateState(false);
      renderBanner();
      renderPhaseNote();
      renderDetail();
      syncNodeClasses();
      updateMonthNav();
      scrollToMonth(next, false);
    }

    function jumpToTodayMonth() {
      const key = monthKey(todayIso(getToday()));
      let target = monthList.indexOf(key) !== -1 ? key : "";
      if (!target) {
        const later = monthList.filter(function (v) { return v >= key; })[0];
        target = later || monthList[monthList.length - 1] || "";
      }
      if (!target) return;
      selectedMonth = target;
      document.getElementById("simMonth").value = target;
      applyDateState(false);
      renderBanner();
      renderPhaseNote();
      renderDetail();
      syncNodeClasses();
      updateMonthNav();
      scrollToMonth(target, false);
    }

    function renderStrip() {
      const scroller = document.getElementById("trackScroller");
      scroller.innerHTML = monthList.map(paneHtml).join("");
      introPlayed = true;
    }

    function scrollToMonth(ym, instant) {
      const scroller = document.getElementById("trackScroller");
      const pane = scroller.querySelector(".month-pane[data-month=\"" + ym + "\"]");
      if (!pane) return;
      syncingScroll = true;
      const left = pane.getBoundingClientRect().left - scroller.getBoundingClientRect().left + scroller.scrollLeft;
      scroller.scrollTo({ left: left, behavior: instant ? "auto" : "smooth" });
      window.setTimeout(function () { syncingScroll = false; }, instant ? 80 : 480);
    }

    function monthFromScroll() {
      const scroller = document.getElementById("trackScroller");
      const panes = scroller.querySelectorAll(".month-pane");
      const mid = scroller.getBoundingClientRect().left + scroller.clientWidth / 2;
      let best = selectedMonth;
      for (let i = 0; i < panes.length; i++) {
        const rect = panes[i].getBoundingClientRect();
        if (mid >= rect.left && mid < rect.right) {
          best = panes[i].getAttribute("data-month");
          break;
        }
      }
      return best;
    }

    function onTrackScroll() {
      if (syncingScroll) return;
      const next = monthFromScroll();
      if (!next || next === selectedMonth) return;
      selectedMonth = next;
      const select = document.getElementById("simMonth");
      if (select.value !== next) select.value = next;
      applyDateState(true);
      renderBanner();
      renderPhaseNote();
      renderDetail();
      syncNodeClasses();
      updateMonthNav();
    }

    function syncNodeClasses() {
      const buttons = document.querySelectorAll("#trackScroller .node");
      for (let i = 0; i < buttons.length; i++) {
        const el = buttons[i];
        const id = el.getAttribute("data-id");
        const isOpen = id === openId;
        el.classList.toggle("open", isOpen);
        el.setAttribute("aria-expanded", isOpen ? "true" : "false");
      }
    }

    function itemDetailHtml(item) {
      const saved = loadItemChecks(item);
      const mid = todoKey(item);
      const checks = (item.todos || []).map(function (text, index) {
        const checked = !!saved[index];
        return (
          "<li class=\"" + (checked ? "checked" : "") + "\">" +
            "<span class=\"chev\" aria-hidden=\"true\">›</span>" +
            "<input type=\"checkbox\" id=\"todo-" + item.id + "-" + index + "\" data-mid=\"" + esc(mid) + "\" data-idx=\"" + index + "\"" + (checked ? " checked" : "") + " />" +
            "<label for=\"todo-" + item.id + "-" + index + "\">" + esc(text) + "</label>" +
          "</li>"
        );
      }).join("");
      const doneCount = (item.todos || []).filter(function (_, i) { return saved[i]; }).length;
      const today = getToday();
      const here = isSpanning(item) && inRange(today, item.rangeStart, item.rangeEnd);
      return (
        "<div class=\"detail-block\">" +
          "<div class=\"detail-head\"><h3>" + esc(item.name) + "</h3>" +
          (item.regionName ? "<span class=\"badge region-" + esc(item.regionId) + "\">" + esc(item.regionName) + "</span>" : "") +
          "<span class=\"badge " + item.status + "\">" + statusText[item.status] + "</span>" +
          (here ? "<span class=\"badge here\">今天在这</span>" : "") +
          (item.predicted ? "<span class=\"badge predicted\">预测</span>" : "") +
          "</div>" +
          "<p class=\"summary\">" + esc(item.summary) + (item.tzNote ? " " + esc(item.tzNote) : "") + "</p>" +
          "<p class=\"progress-note\">待办 " + doneCount + " / " + (item.todos || []).length + " · " + (useBackend ? "勾选已保存到网站服务器" : "勾选保存在这台电脑的浏览器里") + "</p>" +
          "<ul class=\"todos\">" + checks + "</ul>" +
        "</div>"
      );
    }

    function renderDetail() {
      const box = document.getElementById("detail");
      const group = dated.find(function (g) { return g.id === openId; });
      if (!group || !group.items.length) { box.hidden = true; box.innerHTML = ""; return; }
      box.hidden = false;
      const dayHead = group.items.length > 1
        ? "<p class=\"progress-note\" style=\"margin-top:0\">" + esc(formatDate(group.date)) + " · " + group.items.length + " 个任务合在同一个点</p>"
        : "";
      box.innerHTML = dayHead + group.items.map(itemDetailHtml).join("");
    }

    function renderAll(rebuildStrip) {
      renderBanner();
      renderPhaseNote();
      if (rebuildStrip !== false) {
        renderStrip();
        requestAnimationFrame(function () { scrollToMonth(selectedMonth, true); });
      }
      renderDetail();
      updateMonthNav();
    }

    function applyProfile(p) {
      profile = p;
      region = p.region;
      entryYear = entryYearFromAge(p.age);
      if (useBackend) {
        const yearKey = String(entryYear);
        const existing = memoryTodosByYear[yearKey];
        if (!existing || Object.keys(existing).length === 0) {
          try {
            const local = JSON.parse(localStorage.getItem(storageKey()) || "null");
            if (local && typeof local === "object" && Object.keys(local).length) {
              memoryTodosByYear[yearKey] = local;
              saveChecks(local);
            }
          } catch (e) {}
        }
      }
      milestones = buildMilestones(region, entryYear);
      introPlayed = false;
      fillSimSelect();
      applyDateState(false);
      renderSubtitle();
      renderSources();
      renderAll(true);
    }

    function showSetup(prefill) {
      const setup = document.getElementById("setup");
      setup.hidden = false;
      document.getElementById("setupError").textContent = "";
      document.getElementById("setupCancel").hidden = !(profile || loadProfile());
      if (prefill) {
        document.getElementById("ageInput").value = prefill.age;
        setPickedRegion(prefill.region);
      }
    }

    function setPickedRegion(id) {
      pickedRegion = id;
      const buttons = document.querySelectorAll("#regionPicks button");
      for (let i = 0; i < buttons.length; i++) {
        buttons[i].classList.toggle("on", buttons[i].getAttribute("data-region") === id);
      }
    }

    document.getElementById("regionPicks").addEventListener("click", function (event) {
      const btn = event.target.closest("button");
      if (!btn) return;
      setPickedRegion(btn.getAttribute("data-region"));
    });

    document.getElementById("setupGo").addEventListener("click", function () {
      const raw = document.getElementById("ageInput").value.trim();
      const age = Number(raw);
      const err = document.getElementById("setupError");
      if (!raw || !/^\d+$/.test(raw) || age < 12 || age > 22) {
        err.textContent = "请填写 12 到 22 之间的周岁整数。";
        return;
      }
      if (!pickedRegion) {
        err.textContent = "请先选择想申请的地区。";
        return;
      }
      err.textContent = "";
      const next = { age: age, region: pickedRegion };
      saveProfile(next);
      document.getElementById("setup").hidden = true;
      applyProfile(next);
    });

    function fillHelpModal() {
      const setupLead = document.querySelector(".setup-lead");
      const subtitle = document.getElementById("subtitle");
      const swipe = document.querySelector(".swipe-hint");
      document.getElementById("helpSetup").textContent = setupLead ? setupLead.textContent : "";
      document.getElementById("helpSubtitle").textContent = subtitle ? subtitle.textContent : "";
      document.getElementById("helpSwipe").textContent = swipe ? swipe.textContent : "";
    }

    function openHelpModal() {
      fillHelpModal();
      document.getElementById("helpModal").hidden = false;
      document.getElementById("helpAck").focus();
    }

    function closeHelpModal() {
      document.getElementById("helpModal").hidden = true;
    }

    document.getElementById("navChangeProfile").addEventListener("click", function () {
      showSetup(profile || loadProfile());
    });
    document.getElementById("navHow").addEventListener("click", function () {
      helpLeadsToSetup = false;
      openHelpModal();
    });
    document.getElementById("helpAck").addEventListener("click", function () {
      const goSetup = helpLeadsToSetup;
      helpLeadsToSetup = false;
      closeHelpModal();
      if (goSetup) showSetup(profile || loadProfile());
    });
    document.getElementById("backTop").addEventListener("click", function () {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    document.getElementById("setupCancel").addEventListener("click", function () {
      document.getElementById("setup").hidden = true;
    });

    document.getElementById("trackScroller").addEventListener("click", function (event) {
      const btn = event.target.closest(".node");
      if (!btn) return;
      const pane = btn.closest(".month-pane");
      const ym = pane ? pane.getAttribute("data-month") : "";
      openId = btn.getAttribute("data-id");
      if (ym && ym !== selectedMonth) {
        selectedMonth = ym;
        document.getElementById("simMonth").value = ym;
        applyDateState(true);
        renderBanner();
        renderPhaseNote();
      }
      syncNodeClasses();
      renderDetail();
    });

    document.getElementById("detail").addEventListener("change", function (event) {
      const input = event.target;
      if (input.tagName !== "INPUT") return;
      const all = loadChecks();
      const mid = input.getAttribute("data-mid");
      const idx = input.getAttribute("data-idx");
      if (!all[mid]) all[mid] = {};
      all[mid][idx] = input.checked;
      delete all[mid + "-start"];
      delete all[mid + "-end"];
      saveChecks(all);
      renderDetail();
    });

    let scrollTimer = 0;
    document.getElementById("trackScroller").addEventListener("scroll", function () {
      window.clearTimeout(scrollTimer);
      scrollTimer = window.setTimeout(onTrackScroll, 80);
    });
    document.getElementById("trackScroller").addEventListener("wheel", function (event) {
      if (Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;
      event.preventDefault();
      this.scrollLeft += event.deltaY;
    }, { passive: false });

    window.addEventListener("resize", function () {
      if (!selectedMonth) return;
      renderStrip();
      requestAnimationFrame(function () { scrollToMonth(selectedMonth, true); });
      updateMonthNav();
    });
    document.getElementById("simMonth").addEventListener("change", function () {
      selectedMonth = this.value;
      applyDateState(false);
      renderBanner();
      renderPhaseNote();
      renderDetail();
      syncNodeClasses();
      updateMonthNav();
      scrollToMonth(selectedMonth, false);
    });

    document.getElementById("monthPrev").addEventListener("click", function () { goMonth(-1); });
    document.getElementById("monthNext").addEventListener("click", function () { goMonth(1); });
    document.getElementById("jumpToday").addEventListener("click", jumpToTodayMonth);

    (function boot() {
      api("GET", "/api/dates").then(function (data) {
        applyOfficialDates(data);
      }).catch(function () {});

      api("GET", "/api/state").then(function (state) {
        useBackend = true;
        memoryProfile = state.profile || null;
        memoryTodosByYear = state.todos || {};
        if (!memoryProfile) {
          try { memoryProfile = JSON.parse(localStorage.getItem(PROFILE_KEY)); } catch (e) {}
          if (memoryProfile && memoryProfile.age && memoryProfile.region) saveProfile(memoryProfile);
        }
        startApp(memoryProfile);
      }).catch(function () {
        useBackend = false;
        startApp(loadProfile());
      });

      function startApp(saved) {
        if (saved && saved.age && saved.region) {
          setPickedRegion(saved.region);
          document.getElementById("ageInput").value = saved.age;
          applyProfile(saved);
        }
        helpLeadsToSetup = true;
        openHelpModal();
      }
    })();

  </script>
</body>
</html>
